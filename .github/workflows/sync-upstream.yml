name: Propose KlN upstream sync

# Runs trusted tooling from this workflow commit, never candidate application code.
# Integration-owned automation is retained; upstream automation changes are listed
# for separate review. This job never rewrites main, tags a release or deploys.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Published stable KlN release tag (empty selects highest stable version)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pixcook-upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTEGRATION_BRANCH: ${{ vars.PIXCOOK_INTEGRATION_BRANCH || 'pixcook' }}
      REQUESTED_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
    steps:
      - name: Require dedicated sync credentials
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo '::error::Configure SYNC_GITHUB_TOKEN with repository contents, pull-request and workflow write access. No branches were changed.'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preserve trusted sync tooling outside candidate checkout
        run: cp -R .github/upstream-sync-tools "$RUNNER_TEMP/pixcook-upstream-sync-tools"
      - name: Verify safe merge tooling
        run: python -m unittest discover -s "$RUNNER_TEMP/pixcook-upstream-sync-tools" -p 'test_*.py'
      - name: Build source-pinned candidate PR
        id: sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
        run: python "$RUNNER_TEMP/pixcook-upstream-sync-tools/sync_upstream.py"
      - name: Upload sync report and preserved upstream automation diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-report
          path: |
            sync-report.json
            upstream-automation.patch
          if-no-files-found: ignore
          retention-days: 30

name: Pixcook candidate

on:
  pull_request:
    branches: [pixcook]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit selected by release preparation
        required: true
        type: string

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Full unit and migrated PostgreSQL integration tests
        working-directory: backend
        env:
          CI: '1'
        run: |
          go test -p=1 -parallel=16 -tags=unit ./... -count=1 -timeout=900s
          go test -p=1 -tags=integration ./... -count=1 -timeout=900s
      - name: Quality and scheduling concurrency regression
        working-directory: backend
        run: go test -race -p=1 -tags=unit ./internal/service ./internal/repository -run 'Tibo|RouteDegraded|ClassifyTibo|TestGatewayPoolRetryDeadline|TestOpenAIResponseFlush_' -count=1 -timeout=300s
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: make test-frontend
      - run: pnpm --dir frontend run build
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_*.py'
      - run: python -m unittest discover -s .github/upstream-sync-tools -p 'test_*.py'
      - run: python -m unittest discover -s deploy/pixcook -p test_deployment.py
      - run: bash -n .github/release-tools/release-images.sh

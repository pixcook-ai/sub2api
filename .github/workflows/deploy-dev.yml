name: Pixcook development CD

on:
  push:
    branches: [pixcook]
    paths-ignore:
      - 'docs/tasks/**'
      - 'docs/dev-journal.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixcook-development-delivery
  cancel-in-progress: false

jobs:
  candidate:
    if: ${{ github.repository == 'pixcook-ai/sub2api' && github.ref == 'refs/heads/pixcook' }}
    uses: ./.github/workflows/pixcook-candidate.yml
    with:
      source_sha: ${{ github.sha }}

  image:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate deployment helper contracts
        run: python3 -m unittest discover -s .github/deploy-tools -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build tested application commit
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pixcook-ai/sub2api:dev-sha-${{ github.sha }}
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pixcook-ai/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pixcook-dev
          cache-to: type=gha,scope=pixcook-dev,mode=max
      - name: Verify published source and pin digest
        id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/pixcook-ai/sub2api@$DIGEST"
          docker logout ghcr.io
          docker pull "$image"
          actual=$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$actual" = "$SOURCE_SHA"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev
      url: https://dev.pixcook.ai
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse delivery of a superseded integration commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          current=$(git ls-remote https://github.com/pixcook-ai/sub2api.git refs/heads/pixcook | cut -f1)
          test "$current" = "$SOURCE_SHA"
      - name: Deploy verified digest and require runtime proof
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SOURCE_SHA: ${{ github.sha }}
          DEV_SSH_HOST: ${{ vars.DEV_SSH_HOST }}
          DEV_SSH_PORT: ${{ vars.DEV_SSH_PORT }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: python3 .github/deploy-tools/deploy_dev.py --image "$IMAGE" --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: dev-deployment-proof-${{ github.sha }}
          path: dev-deployment-proof.json
          if-no-files-found: error
          retention-days: 90

